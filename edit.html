<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Edit | Class Planner</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
        <script src="theme.js"></script>
    </head>
    <body>
        <aside class="sidebar">
            <h1>Class Planner</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="calendar.html">Calendar</a>
                <a href="edit.html" class="active">Edit</a>
            </nav>
            <button id="theme-toggle" class="theme-toggle" type="button" title="Theme: Auto" aria-label="Theme: Auto">◐</button>
        </aside>

        <main>
            <div class="edit-grid">

                <!-- Top left: Add a Class -->
                <section id="add-class">
                    <h2>Add a Class</h2>
                    <form id="class-form">
                        <label class="field">Course code <span class="req">*</span>
                            <input type="text" id="class-code" placeholder="e.g., MA 241" required>
                        </label>

                        <div class="field-row">
                            <label class="field">Course title
                                <input type="text" id="class-title" placeholder="e.g., Calculus II">
                            </label>
                            <label class="field">Instructor
                                <input type="text" id="class-instructor" placeholder="e.g., Dr. Smith">
                            </label>
                        </div>

                        <div class="field-row">
                            <label class="field">Location
                                <input type="text" id="class-location" placeholder="e.g., SAS Hall 1102">
                            </label>
                            <label class="field">Color
                                <input type="color" id="class-color" value="#e06c75">
                            </label>
                        </div>

                        <div id="meetings">
                            <fieldset class="meeting">
                                <legend>Meeting time</legend>
                                <div class="field-row">
                                    <label class="field">Type
                                        <select class="meeting-type">
                                            <option>Lecture</option>
                                            <option>Recitation</option>
                                            <option>Lab</option>
                                            <option>Other</option>
                                        </select>
                                    </label>
                                    <label class="field">Start <span class="req">*</span>
                                        <input type="time" class="meeting-start" required>
                                    </label>
                                    <label class="field">End <span class="req">*</span>
                                        <input type="time" class="meeting-end" required>
                                    </label>
                                </div>
                                <div class="days">
                                    <label><input type="checkbox" value="M"> Mon</label>
                                    <label><input type="checkbox" value="T"> Tue</label>
                                    <label><input type="checkbox" value="W"> Wed</label>
                                    <label><input type="checkbox" value="H"> Thu</label>
                                    <label><input type="checkbox" value="F"> Fri</label>
                                    <label><input type="checkbox" value="S"> Sat</label>
                                    <label><input type="checkbox" value="U"> Sun</label>
                                </div>
                            </fieldset>
                        </div>

                        <button type="button" id="add-meeting" class="btn btn-secondary">+ Add meeting time</button>
                        <button type="submit" class="btn btn-primary">Save Class</button>
                    </form>
                </section>

                <!-- Top right: Add a Task -->
                <section id="add-task">
                    <h2>Add a Task</h2>
                    <form id="task-form">
                        <label class="field">Task name <span class="req">*</span>
                            <input type="text" id="task-name" placeholder="e.g., Homework 7" required>
                        </label>

                        <div class="field-row">
                            <label class="field">Type <span class="req">*</span>
                                <select id="task-type" required>
                                    <option value="">Choose a type</option>
                                    <option>Assignment / Homework</option>
                                    <option>Exam</option>
                                    <option>Quiz</option>
                                    <option>Project</option>
                                    <option>Studying</option>
                                    <option>Other</option>
                                </select>
                            </label>
                            <label class="field">Class
                                <select id="task-class">
                                    <option value="">None</option>
                                </select>
                            </label>
                        </div>

                        <label class="field" id="task-other-field" hidden>Type name <span class="req">*</span>
                            <input type="text" id="task-other-type" placeholder="e.g., Reading">
                        </label>

                        <div class="field-row">
                            <label class="field">Due date <span class="req">*</span>
                                <input type="date" id="task-date" required>
                            </label>
                            <label class="field">Due time <span class="req">*</span>
                                <input type="time" id="task-time" value="23:59" required>
                            </label>
                        </div>

                        <div class="field-row">
                            <label class="field">Est. hours
                                <input type="number" id="task-hours" min="0" placeholder="0">
                            </label>
                            <label class="field">Est. minutes
                                <input type="number" id="task-minutes" min="0" max="59" step="5" placeholder="0">
                            </label>
                            <label class="field">Priority
                                <select id="task-priority">
                                    <option value="">None</option>
                                    <option>Low</option>
                                    <option>Medium</option>
                                    <option>High</option>
                                </select>
                            </label>
                        </div>

                        <label class="field">Notes
                            <textarea id="task-notes" placeholder="Details, instructions, links..."></textarea>
                        </label>

                        <button type="submit" class="btn btn-primary">Save Task</button>
                    </form>
                </section>

                <!-- Bottom left: Saved Classes -->
                <section id="saved-classes" class="saved-list">
                    <h2>Saved Classes</h2>
                    <p>No classes saved yet.</p>
                </section>

                <!-- Bottom right: Saved Tasks -->
                <section id="saved-tasks" class="saved-list">
                    <h2>Saved Tasks</h2>
                    <p>No tasks saved yet.</p>
                </section>

            </div>

            <div class="danger-zone">
                <button type="button" id="clear-all" class="btn btn-danger">Clear everything</button>
            </div>
        </main>
    </body>
</html>
